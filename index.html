<style>
:root{

*{box-sizing:border-box}
body{margin:0;min-height:100vh}
header{

}
header strong{

  letter-spacing:3px;
  font-weight:400
}
header span{
  font:11px Arial,sans-serif;
  letter-spacing:2px
}
main{
  max-width:1040px;
  margin:auto;
  padding:60px 24px 100px;
  text-align:center
}
.question-title{
  font:800 clamp(23px,3.8vw,40px)/1.22 Arial,sans-serif;
  letter-spacing:-.7px;

p.sub{

}
.choices{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:18px
}
.choice{
  background:#fff;
  border:1px solid #ded7d0;
  border-radius:3px;
  min-height:280px;
  padding:25px 20px;
  cursor:pointer;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:22px;
  color:#292638;
  transition:transform .2s,border-color .2s
}
.choice:hover{
  transform:translateY(-4px);
  border-color:#9e7588
}
.choice .glyph{
  font-size:35px;
  color:#a37b8c
}
.choice .mode-image{
  width:170px;
  height:170px;
  object-fit:contain;
  display:block
}
.choice b{
  font:600 14px/1.6 Arial,sans-serif;
  letter-spacing:1px
}
.back,.action{
  background:none;
  border:1px solid #aaa0a5;
  padding:13px 22px;
  cursor:pointer;
  color:inherit;
  font:12px Arial,sans-serif;
  letter-spacing:1px
}
.action{
  background:#171c31;
  color:white;
  border-color:#171c31
}
.toolbar{
  display:flex;
  justify-content:center;
  gap:12px;
  margin:38px 0;
  flex-wrap:wrap
}
.cards{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:24px;
  justify-content:center;
  max-width:900px;
  margin:auto
}
.cards.one{
  grid-template-columns:minmax(0,330px)
}
.cards.two{
  grid-template-columns:repeat(2,minmax(0,330px));
  max-width:700px
}
.reading{min-width:0}
.reading img{
  display:block;
  width:100%;
  aspect-ratio:5/7;
  object-fit:cover;
  background:#e9e0d9;
  border:1px solid #d8c8bd
}
.reading h2{
  font-size:23px;
  font-weight:400;
  margin:19px 0 9px
}
.reading p{
  font:15px/1.7 Arial,sans-serif;
  color:#514a54;
  margin:0
}
.missing{
  font:12px Arial,sans-serif;
  color:#a34d54;
  margin-top:8px
}
.small{
  font:11px/1.6 Arial,sans-serif;
  color:#827a81;
  margin-top:35px
}
.nav-icon{

  height:150px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:transparent;
  border:1px solid #ded7d0;
  border-radius:12px;
  cursor:pointer;
  padding:0;
  overflow:hidden;
  transition:transform .2s,border-color .2s
}
.nav-icon:hover{
  transform:translateY(-3px);
  border-color:#9e7588
}
.nav-icon img{
  width:100%;
  height:100%;
  object-fit:contain;
  border:0;
  background:transparent;
  aspect-ratio:auto
}
@media(max-width:650px){
  main{padding:45px 18px}
  .choices{grid-template-columns:1fr}
  .choice{min-height:230px;gap:14px}
  .choice .mode-image{width:150px;height:150px}
  .cards,.cards.two{

    max-width:330px;

  header{padding:20px}
  .toolbar{flex-wrap:nowrap;gap:12px}

    width:min(150px,calc((100vw - 48px)/2));
    height:min(150px,calc((100vw - 48px)/2))
  }
}
</style>

const modes={
  love:"¿QUÉ SIENTE POR MÍ?",
  work:"DAME UN CONSEJO EN EL PLANO LABORAL",
  well:"¿QUÉ PUEDO HACER PARA SENTIRME MEJOR?"
};

const app=document.getElementById("app");
let mode=null;
let count=1;

function home(){
  mode=null;
  app.innerHTML=`
    <h1>Elige tu pregunta</h1>
    <p class="sub">Tres caminos. Una respuesta simbólica.</p>
    <div class="choices">
      ${[
        ["love","siente.png"],
        ["work","laboral.png"],
        ["well","mejor.png"]
      ].map(([k,g])=>`
        <button class="choice" data-mode="${k}">
          <img class="mode-image" src="${g}" alt="">
          <b>${modes[k]}</b>
        </button>
      `).join("")}
    </div>
  `;
  app.querySelectorAll("[data-mode]").forEach(b=>{
    b.onclick=()=>choose(b.dataset.mode);
  });
}

function choose(m){
  mode=m;
  app.innerHTML=`
    <h1>${modes[m]}</h1>
    <p class="sub">¿Cuántas cartas quieres sacar?</p>
    <div class="choices">
      ${[1,2,3].map(n=>`
        <button class="choice" data-n="${n}">
          <span class="glyph">${n}</span>
          <b>${n===1?"UNA CARTA":n===2?"DOS CARTAS":"TRES CARTAS"}</b>
        </button>
      `).join("")}
    </div>
    <div class="toolbar">
      <button class="back" id="back">VOLVER</button>
    </div>
  `;
  app.querySelectorAll("[data-n]").forEach(b=>{
    b.onclick=()=>draw(+b.dataset.n);
  });
  document.getElementById("back").onclick=home;
}

function randomInt(max){
  const a=new Uint32Array(1);
  const limit=Math.floor(4294967296/max)*max;
  let x;
  do{
    crypto.getRandomValues(a);
    x=a[0];
  }while(x>=limit);
  return x%max;
}

function imageCandidates(path){
  // Rutas exactas de las carpetas y archivos WebP proporcionados.
  return [path];
}

function loadCardImage(img,path,error){
  const candidates=imageCandidates(path);
  let pos=0;

  img.onerror=()=>{
    pos++;
    if(pos<candidates.length){
      img.src=encodeURI(candidates[pos]);
      return;
    }
    img.style.display="none";
    error.hidden=false;
    error.textContent=
      "Imagen no encontrada: "+path+
      ". Comprueba el nombre de la carpeta y que esté junto a index.html.";
  };

  img.src=encodeURI(candidates[0]);
}

function draw(n){
  count=n;
  let pool=deck.map((_,i)=>i);
  let chosen=[];

  for(let i=0;i<n;i++){
    const j=randomInt(pool.length);
    chosen.push(deck[pool.splice(j,1)[0]]);
  }

  app.innerHTML=`
    <h1>Tu tirada</h1>
    <h2 class="question-title">${modes[mode]}</h2>
    <div class="cards ${n===1?"one":n===2?"two":""}">
      ${chosen.map((c,i)=>`
        <article class="reading">
          <img id="img${i}" alt="${c.name}">
          <h2>${c.name}</h2>
          <p>${c[mode]}</p>
          <div class="missing" id="err${i}" hidden>
            Imagen no encontrada. Comprueba el nombre del archivo.
          </div>
        </article>
      `).join("")}
    </div>
    <div class="toolbar">
      <button class="nav-icon" id="start"
        aria-label="Volver al inicio" title="Inicio">
        <img src="inicio.png" alt="Inicio">
      </button>
      <button class="nav-icon" id="change"
        aria-label="Elegir otro número de cartas" title="Elegir tirada">
        <img src="tirada.png" alt="Elegir tirada">
      </button>
    </div>
  `;

  chosen.forEach((c,i)=>{
    const img=document.getElementById("img"+i);
    loadCardImage(
      img,
      c.path,
      document.getElementById("err"+i)
    );
  });

  document.getElementById("change").onclick=()=>choose(mode);
  document.getElementById("start").onclick=home;
}

home();
</script>
